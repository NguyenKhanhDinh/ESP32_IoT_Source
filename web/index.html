<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>IoT Sensor Dashboard</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #181818;
        color: white;

        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        width: 90%;
        max-width: 1000px;
        text-align: center;
      }

      h1 {
        font-size: 36px;
        margin-bottom: 15px;
      }

      .status {
        font-size: 18px;
        margin-bottom: 35px;
        color: #aaa;
      }

      .dashboard {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 25px;
      }

      .card {
        background: #282828;
        padding: 30px 20px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      }

      .icon {
        font-size: 40px;
      }

      .card h2 {
        margin: 15px 0 25px;
        font-size: 22px;
      }

      .value {
        font-size: 48px;
        font-weight: bold;
      }

      .unit {
        font-size: 20px;
        color: #aaa;
        margin-left: 5px;
      }

      .updated {
        margin-top: 35px;
        color: #aaa;
        font-size: 16px;
      }

      #updated {
        color: white;
        font-weight: bold;
      }

      @media (max-width: 700px) {
        .dashboard {
          grid-template-columns: 1fr;
        }

        h1 {
          font-size: 28px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>IoT Sensor Dashboard</h1>

      <div id="status" class="status">TEST: JavaScript đang khởi động...</div>

      <div class="dashboard">
        <div class="card">
          <div class="icon">🌡️</div>
          <h2>Temperature</h2>
          <span id="temperature" class="value">--</span>
          <span class="unit">°C</span>
        </div>

        <div class="card">
          <div class="icon">💧</div>
          <h2>Humidity</h2>
          <span id="humidity" class="value">--</span>
          <span class="unit">%</span>
        </div>

        <div class="card">
          <div class="icon">☀️</div>
          <h2>Light</h2>
          <span id="light" class="value">--</span>
          <span class="unit">lux</span>
        </div>
      </div>

      <div class="updated">
        Last updated:
        <span id="updated">--</span>
      </div>
    </div>

    <script>
      console.log("INLINE JAVASCRIPT IS RUNNING");

      const statusElement = document.getElementById("status");

      statusElement.textContent = "JavaScript OK - đang kết nối SSE...";

      const eventSource = new EventSource("/api/telemetry");

      eventSource.onopen = function () {
        console.log("SSE CONNECTED");

        statusElement.textContent = "Realtime connected";
      };

      eventSource.onmessage = function (event) {
        console.log("SSE MESSAGE:", event.data);

        try {
          const data = JSON.parse(event.data);

          document.getElementById("temperature").textContent = Number(
            data.temperature,
          ).toFixed(2);

          document.getElementById("humidity").textContent = Number(
            data.humidity,
          ).toFixed(2);

          document.getElementById("light").textContent = Number(
            data.light,
          ).toFixed(2);

          document.getElementById("updated").textContent =
            new Date().toLocaleTimeString();

          statusElement.textContent = "Realtime connected";
        } catch (error) {
          console.error("JSON ERROR:", error);
          statusElement.textContent = "JSON error";
        }
      };

      eventSource.onerror = function (error) {
        console.error("SSE ERROR:", error);

        statusElement.textContent = "SSE connection error";
      };
    </script>
  </body>
</html>
